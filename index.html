<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Access</title> <style> body { background:#000; color:#0f0; font-family:monospace; text-align:center; padding-top:50px; } input { padding:10px; font-size:18px; } img { max-width:90%; margin:20px0; border:1px solid #0f0; } #pics { display:none; } </style> </head> <body> <h2>Enter Access Code</h2> <input type="password" id="code" placeholder="code"> <button onclick="check()">Unlock</button> <div id="pics"> <p>Front camera</p> <img id="front"><p>Back camera</p> <img id="back"></div> <script> const SECRET = 'unlock42';function check() { if (document.getElementById('code').value === SECRET) { document.getElementById('front').src = localStorage.getItem('frontCam') || ''; document.getElementById('back').src = localStorage.getItem('backCam') || ''; document.getElementById('pics').style.display = 'block'; } else { alert('wrong'); } } </script> </body> </html>
