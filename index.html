<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Reveal</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2d3436;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            padding: 20px;
            width: 90%;
        }

        .code-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        input {
            padding: 15px;
            font-size: 1.5rem;
            width: 150px;
            border-radius: 10px;
            border: none;
            margin-bottom: 20px;
            text-align: center;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2rem;
            background-color: #0984e3;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .photo-grid {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        .photo-item {
            flex: 1;
            min-width: 200px;
            border-radius: 15px;
            overflow: hidden;
            border: 3px solid white;
        }

        .photo-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .photo-label {
            background: white;
            color: black;
            padding: 5px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        #hidden-area {
            display: none;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="input-area" class="code-box">
            <h2 style="font-size: 2rem;">Enter the Secret Code</h2>
            <input type="text" id="user-code" placeholder="????">
            <br>
            <button onclick="unlock()">Unlock</button>
        </div>

        <div id="hidden-area" class="photo-grid">
            <div class="photo-item">
                <img id="img-front" src="" alt="Front View">
                <div class="photo-label">FRONT VIEW</div>
            </div>
            <div class="photo-item">
                <img id="img-back" src="" alt="Back View">
                <div class="photo-label">BACK VIEW</div>
            </div>
        </div>
    </div>

    <script>
        const secretCode = "7707"; // Change this to your secret code

        function unlock() {
            const input = document.getElementById('user-code').value;
            if (input === secretCode) {
                // Pull photos from Local Storage
                const front = localStorage.getItem('frontPhoto');
                const back = localStorage.getItem('backPhoto');

                document.getElementById('img-front').src = front;
                document.getElementById('img-back').src = back;

                // Show the photos and hide the input
                document.getElementById('hidden-area').style.display = "flex";
                document.getElementById('input-area').style.display = "none";
                
                // Add a little pop effect
                document.getElementById('hidden-area').style.animation = "pop 0.5s ease-out";
            } else {
                alert("Incorrect code!");
            }
        }
    </script>

    <style>
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</body>
</html>
